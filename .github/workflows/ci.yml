name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate character data
        run: npm run validate:data

      - name: Unit tests
        run: npm test

      - name: Typecheck Pages Functions
        run: npx tsc -p tsconfig.functions.json

      - name: Typecheck cron-worker
        run: npx tsc -p cron-worker/tsconfig.json

      - name: Verify D1 migrations on a fresh database
        run: npx wrangler d1 migrations apply acgti-stats --local

      - name: Build
        run: npm run build
